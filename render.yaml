services:
  - type: web
    name: ai-pm-quality-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.quality_agent_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: public
      - key: MODEL_PROVIDER
        value: mock
      - key: MODEL_KILL_SWITCH
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://yangyang-btc.github.io
      - key: EVALUATION_LAB_URL
        sync: false
