name: deploy-portfolio-pages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "projects/*/browser/**"
      - "research/**"
      - "tools/build_pages_artifact.mjs"
      - "tests/test_pages_artifact.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --dev --frozen
      - run: pnpm lint
      - run: pnpm test
      - run: uv run pytest tests/test_research_content.py tests/test_pages_artifact.py -q
      - run: pnpm build:pages
        env:
          BASE_URL: ${{ vars.PAGES_BASE_URL || format('/{0}/', github.event.repository.name) }}
          GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          EVALUATION_LAB_URL: ${{ vars.EVALUATION_LAB_URL }}
          QUALITY_API_URL: ${{ vars.QUALITY_API_URL }}
          PUBLIC_RESUME_URL: ${{ vars.PUBLIC_RESUME_URL }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
